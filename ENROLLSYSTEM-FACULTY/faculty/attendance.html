<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/faculty.css">
  <link rel="stylesheet" href="css/faculty-extra.css">
</head>
<body class="admin-layout">
  <div id="facultySidebarWrap"></div>
  <div class="admin-main">
    <div id="facultyHeader"></div>
    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-head"><i class="fas fa-user-check"></i> Attendance</div>
        <div class="admin-card-body padded" id="attendanceBody">
          <div class="admin-empty">Loading attendance...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/faculty.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!FacultyApp.requireAuth()) return;
      FacultyApp.initLayout('attendance', 'Attendance');
      FacultyApp.loadAttendancePage('attendanceBody');
    });
  </script>
</body>
</html>
