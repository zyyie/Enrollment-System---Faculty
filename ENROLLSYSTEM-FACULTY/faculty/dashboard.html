<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/faculty.css">
  <link rel="stylesheet" href="css/faculty-extra.css">
</head>
<body class="admin-layout">
  <div id="facultySidebarWrap"></div>
  <div class="admin-main">
    <div id="facultyHeader"></div>
    <main class="admin-content faculty-dashboard-page">
      <div id="dashboardBody">
        <div class="admin-empty">Loading dashboard...</div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/faculty.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!FacultyApp.requireAuth()) return;
      FacultyApp.initLayout('dashboard', 'Teacher Dashboard', { variant: 'dashboard', notificationCount: 2 });
      FacultyApp.loadTeacherDashboard('dashboardBody');
    });
  </script>
</body>
</html>
