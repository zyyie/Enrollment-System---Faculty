<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials - Faculty Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/faculty.css">
  <link rel="stylesheet" href="css/faculty-extra.css">
</head>
<body class="admin-layout">
  <div id="facultySidebarWrap"></div>
  <div class="admin-main">
    <div id="facultyHeader"></div>
    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-head"><i class="fas fa-folder-open"></i> Learning Materials</div>
        <div class="admin-card-body padded">
          <div class="faculty-materials-intro">
            <div class="faculty-materials-icon"><i class="fas fa-cloud-arrow-up"></i></div>
            <div>
              <h2>Upload and share class materials</h2>
              <p>Post modules, handouts, and activity sheets for your students. File upload will be enabled in the next portal update.</p>
            </div>
          </div>
          <div class="faculty-materials-list">
            <div class="faculty-materials-item">
              <span class="faculty-materials-item-icon"><i class="fas fa-file-pdf"></i></span>
              <div>
                <strong>Sample Class Module</strong>
                <span>Placeholder • PDF • Available soon</span>
              </div>
            </div>
            <div class="faculty-materials-item">
              <span class="faculty-materials-item-icon"><i class="fas fa-file-lines"></i></span>
              <div>
                <strong>Activity Sheets</strong>
                <span>Placeholder • Document • Available soon</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/faculty.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!FacultyApp.requireAuth()) return;
      FacultyApp.initLayout('materials', 'Materials');
    });
  </script>
</body>
</html>
