<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login - Enrollment System</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: Segoe UI, sans-serif; }

    .login-page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
      background: linear-gradient(160deg, #1a3a6b 0%, #0f2447 55%, #162d52 100%);
    }
    .login-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    .login-bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(26, 58, 107, 0.5), rgba(15, 36, 71, 0.6));
      z-index: 1;
      pointer-events: none;
    }

    .faculty-login-card {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      width: min(440px, 100%);
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 0 0 auto;
      background: #fff;
      border-radius: 0;
      padding: 48px 40px;
      box-shadow: -4px 0 32px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    .faculty-login-card img { width: 72px; display: block; margin: 0 auto 16px; }
    .faculty-login-card h1 { text-align: center; font-size: 22px; margin: 0 0 8px; color: #1a3a6b; }
    .faculty-login-card p { text-align: center; color: #64748b; margin: 0 0 24px; font-size: 14px; }
    .faculty-login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .faculty-login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    .password-field { position: relative; display: block; margin-bottom: 14px; }
    .password-field input { margin-bottom: 0; padding-right: 42px; }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .password-toggle svg { display: block; width: 18px; height: 18px; }
    .password-toggle:hover,
    .password-toggle:focus-visible { color: #1a3a6b; background: rgba(26, 58, 107, 0.06); outline: none; }
    .password-toggle.is-visible { color: #1a3a6b; }
    /* Edge: hide native password eye (see also password-field.js injected styles) */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .faculty-login-card button[type="submit"] { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a3a6b; color: #fff; font-weight: 600; cursor: pointer; }
    .faculty-login-card .error { color: #dc2626; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="faculty-login-card">
      <h1>Faculty Portal</h1>
      <p>Teachers sign in to manage grades and view your schedule</p>
      <div class="error" id="loginError"></div>
      <form id="facultyLoginForm">
        <label for="facultyId">Faculty ID</label>
        <input type="text" id="facultyId" placeholder="FAC-STEM-01" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <script src="js/password-field.js?v=4"></script>
  <script>
    document.getElementById('facultyLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const facultyId = document.getElementById('facultyId').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/faculty', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facultyId, password })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          errorEl.textContent = data.error || 'Invalid credentials';
          return;
        }
        sessionStorage.setItem('shsFaculty', JSON.stringify(data.faculty));
        sessionStorage.setItem('loginRole', 'teacher');
        window.location.href = 'faculty/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
